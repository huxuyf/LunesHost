name: Auto-login-Lunes

on:
  workflow_dispatch:            # 手动触发
  schedule:
    # ⚠️ cron 只认 UTC：北京时间 = UTC + 8
    # 当前：每月 1/5/10/15/20/25/28 日 UTC 06:04 = 北京时间 14:04，间隔均匀约 10 天
    - cron: '4 6 1,5,10,15,20,25,28 * *'

jobs:
  Renew-lunes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write           # time.txt 提交推送需要
      actions: write            # gh run delete 清理记录需要
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v6

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和Python依赖
        run: |
          sudo apt-get update
          sudo apt-get install xvfb x11-utils xdotool scrot fonts-noto-cjk -y
          pip install seleniumbase aiohttp requests
          seleniumbase install chromedriver

      - name: 🌐 设置sing-box代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}   # 在 secret 里设置 NODE_LINK 代理启用代理
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}  # 飞书自定义机器人 webhook（可选）
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}            # 飞书机器人签名密钥（可选）
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py

      # 更新时间到 time.txt，避免仓库长期无活动导致 schedule 被自动停用
      # （60 天无活动自动禁用只针对 public 仓库；private 仓库无此限制）
      - name: 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            # 拉取并变基到最新 main；time.txt 冲突时自动保留本次写入的新时间戳
            # （rebase 中 ours=远端、theirs=本地提交，故用 -X theirs）
            git pull --rebase origin main -X theirs || git rebase --abort
            git push origin main
          fi

      - name: 🧹 清理旧的工作流运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
